name: Deploy PWA to GitHub Pages

# Every push builds and deploys a new version.
# One-time setup by the repo owner: Settings → Pages → Source: "GitHub Actions".
# One branch only. `main` was listed here and does not exist; if it were ever
# created (a default-branch rename, a merge, a fork) a push to it would publish
# over the real branch's build with nothing to say two sources exist - and the
# 10-minute Pages HTML cache makes that slow to notice.
on:
  push:
    branches:
      - claude/737-instructor-monitoring-dashboard-2ox5gd
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, don't cancel a run in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung npm ci or npm test would otherwise hold the `pages` concurrency
    # group for the runner's six-hour default and block every later deploy.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Gate the deploy on the logic tests: merge, sync coverage and the FTE
      # arithmetic. They need no browser and run in seconds, so there is no
      # reason for a red checkout to reach the live site.
      - run: npm test
      # A Supabase project is baked into src/lib/cloudConfig.js, so these secrets
      # are optional: set them only to point this deploy at a different project.
      # They are read as a pair – setting one ignores both baked-in defaults.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
